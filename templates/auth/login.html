{% extends 'web/base.html' %}
{% block content %}

<main id="main">
  <div class="container" style="max-width: 480px; padding-top: var(--s7); padding-bottom: var(--s7)">
    <h1>Log in</h1>
    <p style="color: var(--fg-soft); margin-bottom: var(--s5)">Welcome back — enter your details below.</p>

    <form method="POST" action="{% url 'login' %}">
      {% csrf_token %}

      <div class="field">
        <label for="id_email">Email</label>
        <input id="id_email" name="email" type="email" required value="{{ form.email.value|default:'' }}">
        {{ form.email.errors }}
      </div>

      <div class="field">
        <label for="id_password">Password</label>
        <input id="id_password" name="password" type="password" required>
        {{ form.password.errors }}
      </div>

      <button class="btn btn--indigo btn--block" type="submit" style="margin-top: var(--s3)">Log in →</button>
    </form>

    <p style="margin-top: var(--s5); font-size: var(--text-sm)">
      Don't have an account? <a href="{% url 'register' %}" style="color: var(--indigo)">Create one</a>
    </p>
    <p style="margin-top: var(--s3); font-size: var(--text-sm)">
      <a href="{% url 'password_reset' %}" style="color: var(--indigo)">Forgot your password?</a>
    </p>
  </div>
</main>

{% endblock %}
