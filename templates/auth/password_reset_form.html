{% extends 'web/base.html' %}
{% block content %}
<main id="main">
  <div class="container" style="max-width: 480px; padding-top: var(--s7); padding-bottom: var(--s7)">
    <h1>Reset your password</h1>
    <p style="color: var(--fg-soft); margin-bottom: var(--s5)">Enter your email and we'll send you a link to reset your password.</p>

    <form method="POST">
      {% csrf_token %}
      <div class="field">
        <label for="id_email">Email</label>
        <input id="id_email" name="email" type="email" required>
      </div>
      <button class="btn btn--indigo btn--block" type="submit" style="margin-top: var(--s3)">Send reset link →</button>
    </form>
  </div>
</main>
{% endblock %}
